<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación - Catálogo de Películas y Series</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .presentacion {
            text-align: center;
            padding: 50px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .presentacion h1 {
            font-size: 3em;
            color: #2d3436;
            margin-bottom: 30px;
        }

        .universidad-info {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            margin-bottom: 40px;
        }

        .universidad-info h2 {
            color: #0984e3;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .universidad-info p {
            font-size: 18px;
            margin-bottom: 15px;
            color: #636e72;
        }

        .btn-entrar {
            background: #0984e3;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }

        .btn-entrar:hover {
            background: #74b9ff;
        }
    </style>
</head>
<body>
    <div class="presentacion">
        <h1>🎬 Catálogo de Películas y Series</h1>

        <div class="universidad-info">
            <h2>Proyecto Académico</h2>
            <p><strong>Universidad:</strong> Universidad Tecnológica de la Selva</p>
            <p><strong>Cuatrimestre:</strong> 8º B</p>
            <p><strong>Carrera:</strong> Desarrollo y Gestión de Software</p>
            <p><em>David Humberto Jiménez Camacho</em></p>
        </div>

        <a href="index.html" class="btn-entrar">Entrar al Catálogo</a>
    </div>
</body>
</html>
